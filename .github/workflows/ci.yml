name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        working-directory: apps/api

      - name: Test controlled canary rollout
        run: pnpm --filter @bridgewise/relayer-service exec jest --runInBand --moduleFileExtensions ts json js -- executors/canary-rollout.spec.ts
      - name: Test key vault and rotation lifecycle
        run: pnpm --filter api exec jest --runInBand --moduleFileExtensions ts json js -- security/api-key-vault.service.spec.ts security/api-key-rotation.service.spec.ts

      - name: Build
        run: pnpm run build
        working-directory: apps/api

      - name: Test
        run: pnpm run test
        working-directory: apps/api

      - name: Test e2e
        run: pnpm run test:e2e
        working-directory: apps/api

      - name: Build relayer service
        run: pnpm --filter @bridgewise/relayer-service build

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Cargo Rules
        run: cargo test

